name: Rádio · Six Star News

on:
  schedule:
    - cron: '0 9 * * *'     # 06:00 em São Paulo
  workflow_dispatch:
    inputs:
      date:
        description: 'Data do briefing (AAAA-MM-DD). Vazio = hoje'
        required: false

permissions:
  contents: read

jobs:
  bulletins:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_URL: ${{ vars.PRODUCTION_URL }}   # variável do repositório (sem environment: não precisa de aprovação diária)
      RADIO_PIPELINE_TOKEN: ${{ secrets.RADIO_PIPELINE_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/radio-news
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/radio-news/requirements.txt
      - name: Modelo Kokoro (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install -r tools/radio-news/requirements.txt
      - name: Gerar boletins
        run: python tools/radio-news/pipeline.py --date "${{ github.event.inputs.date }}" --out out
      - name: Enviar para o R2
        run: aws s3 sync out/ "s3://$R2_BUCKET/radio/news/" --endpoint-url "$R2_ENDPOINT" --content-type audio/mpeg --exclude '*.json' --cache-control 'public, max-age=31536000, immutable'
      - name: Registrar no portal
        run: |
          curl -fsS -X POST "$APP_URL/internal/radio/bulletins" \
            -H "Authorization: Bearer $RADIO_PIPELINE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @out/manifest.json
