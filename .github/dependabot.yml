version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    groups:
      laravel: { patterns: ["laravel/*", "livewire/*", "filament/*"] }
      dev-tools: { dependency-type: development }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    groups:
      frontend: { patterns: ["*"], update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }
  - package-ecosystem: pip
    directory: /tools/radio-news
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
